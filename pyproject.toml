[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stackman"
version = "0.1.0"
description = "Stacked pull request manager for local Git workflows"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = ["click>=8.1,<9"]

[project.scripts]
stackman = "stackman.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.16,<0.17",
  "ty>=0.0.70,<0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stackman"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.ty.src]
include = ["src/stackman"]
